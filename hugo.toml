baseURL = 'https://victorhge.github.io/'
languageCode = 'en-us'
rssLimit = 10
copyright = "Source code [here](https://github.com/victorhge/victorhge.github.io), licensed under GPLv3 ·"
hasCJKLanguage = true
defaultContentLanguage = "en"

[params]
env = "production"
comments = true
displayFullLangName = true
author = 'Victor Ren'
keywords= [ "Blog", "Software", "Engineering"]
defaultTheme = "auto"
ShowFullTextInRSS = true
ShowReadingTime = true
ShowShareButtons = true
ShowPostNavLinks = true
ShowBreadCrumbs = true
hideAuthor = true
ShowCodeCopyButtons = true
ShowWordCount = true
ShowRssButtonInSectionTermList = true
UseHugoToc = true
disableSpecial1stPost = false
disableScrollToTop = false
hidemeta = false
hideSummary = false
showtoc = true
tocopen = false

[params.contact]
email = 'victorhge@gmail.com'
[[params.socialIcons]]
icon = "fab fa-github"
name = "github"
url = "https://github.com/victorhge"

[params.giscus]
 repo = "victorhge/victorhge.github.io"
 repo-id="R_kgDORZLkcQ"
 category="Announcements"
 category-id="DIC_kwDORZLkcc4C3Y3X"

[params.editPost]
  URL = "https://github.com/victorhge/victorhge.github.io/blob/main/content"
  Text = "Suggest Changes"
  appendFilePath = true

[module]
[[module.imports]]
path="github.com/adityatelange/hugo-PaperMod"
theme = "PaperMod"

[markup.goldmark.renderer]
unsafe = true

[markup.goldmark.extensions.cjk]
eastAsianLineBreaks = true
eastAsianLineBreaksStyle = 'simple'
enable = true
escapedSpace = false

defaultContentLanguageInSubdir = false
DefaultContentLanguage = "en"
[languages]
[languages.en]
title = 'Illusion and Trifle'
languageName = "English"
weight = 1

